/* Layout: spreadsheet-style workbook — sheet tabs, red open-queries block, unit header, navy-header table that scrolls inside its own box */
:root{
  --bg:#ffffff; --fg:#1b1f24; --muted:#595959; --line:#d4d9e1; --hdr:#1f4e78; --hdr-fg:#ffffff;
  --query:#c00000; --green:#e2efda; --orange:#fce4d6; --live:#ddebf7; --okc:#2e7d32; --tab:#eef1f5; --zebra:#fafbfc; --short:#fde2e1; --over:#e2f5e6; --neg:#fff1d6;
  --sans:Arial,"Helvetica Neue",Helvetica,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14181d; --fg:#e6e9ee; --muted:#a3abb7; --line:#2d343d; --hdr:#2b5f8f; --hdr-fg:#ffffff;
  --query:#ff7b7b; --green:#1f3a26; --orange:#43301f; --live:#1d3349; --okc:#7bd88f; --tab:#1d232b; --zebra:#171c22; --short:#47201f; --over:#1f3a26; --neg:#3d3118; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14181d; --fg:#e6e9ee; --muted:#a3abb7; --line:#2d343d; --hdr:#2b5f8f; --hdr-fg:#ffffff;
  --query:#ff7b7b; --green:#1f3a26; --orange:#43301f; --live:#1d3349; --okc:#7bd88f; --tab:#1d232b; --zebra:#171c22; --short:#47201f; --over:#1f3a26; --neg:#3d3118; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:13px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 32px;display:grid;gap:12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.tile{border:1px solid var(--line);border-radius:6px;padding:8px 10px;display:grid;gap:2px}.tile .v{font-size:18px;font-weight:bold;font-variant-numeric:tabular-nums}.tile small{color:var(--muted)}
#tb tr.cs td{background:var(--short)} #tb tr.co td{background:var(--over)} #tb tr.cn td{background:var(--neg)} td.lv{box-shadow:inset 3px 0 0 var(--hdr)}
.wrap>*,#sheet>*{min-width:0} #sheet{display:grid;gap:10px}
.tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:2px solid var(--hdr)}
.tabs button{font:inherit;font-weight:bold;padding:7px 14px;border:1px solid var(--line);border-bottom:none;background:var(--tab);color:var(--fg);border-radius:4px 4px 0 0;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--hdr);color:var(--hdr-fg);border-color:var(--hdr)}
.tabs button:focus-visible,#q:focus{outline:2px solid var(--query);outline-offset:1px}
.q h2{color:var(--query);font-size:15px;margin:0 0 4px}
.q ul{margin:0;padding-left:18px;color:var(--query);font-weight:bold;font-size:14px;display:grid;gap:3px;max-width:110ch}
h1{font-size:18px;margin:4px 0 0;text-wrap:balance}
.meta{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;max-width:640px}
.meta b{white-space:nowrap}
.meta .v{font-variant-numeric:tabular-nums}
.note{color:var(--muted);font-size:12px;max-width:110ch}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#q{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--fg);flex:1 1 220px;max-width:360px}
.stamp{color:var(--muted);font-size:12px}
.tbl{overflow:auto;max-height:75vh;border:1px solid var(--line)}
table{border-collapse:collapse;font-size:12.5px;min-width:100%}
th{position:sticky;top:0;background:var(--hdr);color:var(--hdr-fg);text-align:left;padding:6px 8px;font-weight:bold;white-space:nowrap;border:1px solid var(--line)}
td{padding:4px 8px;border:1px solid var(--line);vertical-align:top}
tr:nth-child(even) td{background:var(--zebra)}
tr.g td{background:var(--green)} tr.o td{background:var(--orange)}
tr.tot td{font-weight:bold;background:var(--tab)}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.w{min-width:240px} td.code{white-space:nowrap}
.sum td:first-child{font-weight:bold;white-space:nowrap}
.sum tr.b td{font-weight:bold;background:var(--tab)}
tr.l td{background:var(--live)}
.cnt{width:84px;font:inherit;padding:3px 5px;border:1px solid var(--line);border-radius:3px;background:var(--bg);color:var(--fg);text-align:right}
.cnt:focus{outline:2px solid var(--hdr)}
.ok{color:var(--okc);font-weight:bold;margin-left:4px}
.live{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-left:4px solid var(--hdr);background:var(--tab);max-width:110ch}
.live button{font:inherit;font-weight:bold;padding:5px 10px;border:1px solid var(--hdr);background:var(--bg);color:var(--fg);border-radius:4px;cursor:pointer}
.live button[aria-pressed="true"]{background:var(--hdr);color:var(--hdr-fg)}
.live button:focus-visible{outline:2px solid var(--query)}
label{display:inline-flex;gap:4px;align-items:center}
</style>

const UNITS={}; D.forEach((s,i)=>{if(s.name!=="Summary"&&s.name!=="New Fittings"){const h=s.hdr-1;UNITS[s.name]={i,h,base:s.rows.slice(h+1).map(r=>r.slice()),cls:s.cls.slice(h+1)}}});
D.push({name:"Count vs Sage",virtual:true});
const WH=n=>n==="Van MSU"?"van":"ws";
const docId=c=>c.replace(/[^A-Za-z0-9_\-.:@+]/g,ch=>"~"+ch.charCodeAt(0).toString(16));
const shard=c=>[...c].reduce((a,ch)=>a+ch.charCodeAt(0),0)%2;
let LIVE={van:{},ws:{}}, DB=null, ME=null, CANWRITE=false, NAMES={}, cur=0, countMode=false;
function rowsOf(name){ // rows with live counts applied, plus total row
  const U=UNITS[name], L=LIVE[WH(name)];
  const out=U.base.filter(r=>r[3]!=="TOTAL").map((r,k)=>{const x=r.slice(), lv=L[r[1]];
    if(lv){x[4]=lv.qty;x[13]=typeof x[12]==="number"?lv.qty*x[12]:"";x[15]=typeof x[14]==="number"?lv.qty*x[14]:"";x[16]="Live count";
      x[17]=`Counted ${lv.qty} by ${NAMES[lv.by]||"staff"} ${new Date(lv.at).toLocaleString("en-ZA",{dateStyle:"short",timeStyle:"short"})}`+(r[4]!==lv.qty&&r[4]!=null?` (sheet had ${r[4]})`:"");}
    return {r:x,cls:lv?"l":U.cls[k]}});
  const tc=out.reduce((a,o)=>a+(typeof o.r[13]==="number"?o.r[13]:0),0), ts=out.reduce((a,o)=>a+(typeof o.r[15]==="number"?o.r[15]:0),0);
  return {out,tc,ts,lines:name==="Van MSU"?out.length:out.filter(o=>typeof o.r[4]==="number").length,live:Object.keys(L).length,
    sec:SECS.map(s=>out.reduce((a,o)=>a+(o.r[0]===s&&typeof o.r[13]==="number"?o.r[13]:0),0))};
}
function tabs(){document.getElementById("tabs").innerHTML=D.map((s,i)=>`<button role="tab" id="t${i}" aria-selected="${i===cur}">${esc(s.name)}</button>`).join("");
  D.forEach((s,i)=>document.getElementById("t"+i).onclick=()=>{cur=i;countMode=false;try{localStorage.setItem("ffsheet",i)}catch(e){};tabs();show()});}
function bar(){
  const el=document.getElementById("livebar"), s=D[cur], unit=UNITS[s.name];
  const n=Object.keys(LIVE.van).length+Object.keys(LIVE.ws).length;
  let msg=!DB?`View-only copy, last updated ${STAMP.replace(/^Updated /,"").split(" · ")[0]}. Counting is done on the Claude link.`:
    `Live: ${n} line${n===1?"":"s"} counted on this link so far (Van ${Object.keys(LIVE.van).length}, Workshop ${Object.keys(LIVE.ws).length}). Totals update as counts come in.`;
  if(DB&&!CANWRITE) msg+=" You can view only. To count, ask Michael to add you as an editor.";
  el.innerHTML=`<span>${esc(msg)}</span>`+(unit&&CANWRITE?`<button type="button" id="cm" aria-pressed="${countMode}">${countMode?"Counting: quantities hidden":"Count this unit"}</button>`:"");
  const b=document.getElementById("cm"); if(b) b.onclick=()=>{countMode=!countMode;show()};
}
function summary(el){
  const s=D[cur], R=s.rows, h=s.hdr-1, H=R[h];
  const v=rowsOf("Van MSU"), w=rowsOf("Workshop");
  const line=(lab,a,b,c,d,cls="")=>`<tr class="${cls}"><td>${esc(lab)}</td>${a.map(x=>`<td class="n">${money(x)}</td>`).join("")}<td class="n">${money(b)}</td><td class="n">${money(c)}</td><td class="n">${qty(d)}</td></tr>`;
  const add=(x,y)=>x.map((q,i)=>q+y[i]);
  const notes=R.slice(h+1).filter(r=>r[0]&&r.slice(1).every(x=>x==null)).map(r=>`<tr><td colspan="9" class="note">${esc(r[0])}</td></tr>`).join("");
  el.innerHTML=`<div class="q"><ul style="list-style:none;padding:0"><li>${esc(R[0][0])}</li></ul></div><h1>${esc(R[2][0])}</h1>
  <div class="tbl" style="max-height:none"><table class="sum"><thead><tr>${H.map(x=>`<th>${esc(x)}</th>`).join("")}</tr></thead><tbody>
  ${line("Van MSU",v.sec,v.tc,v.ts,v.lines)}${line("Workshop",w.sec,w.tc,w.ts,w.lines)}
  ${line("All stock (MSU + Workshop)",add(v.sec,w.sec),v.tc+w.tc,v.ts+w.ts,v.lines+w.lines,"b")}${notes}</tbody></table></div>
  <p class="stamp">Sheet built ${esc(STAMP)}. Live counts on this link are added on top.</p>`;
}
function unitSheet(el){
  const s=D[cur], R=s.rows, U=UNITS[s.name], h=U.h, X=rowsOf(s.name);
  let i=1; const qs=[]; while(R[i]&&R[i][0]&&String(R[i][0]).startsWith("•")){qs.push(String(R[i][0]).slice(2));i++}
  const ti=R.findIndex(r=>r[0]==="Unit:")-1, u=R.slice(ti+1,ti+4), H=R[h];
  const vals=[X.tc,X.ts,X.lines];
  const cols=countMode?[0,1,2,3,4]:H.map((_,j)=>j);
  el.innerHTML=`<div class="q"><h2>${esc(R[0][0])}</h2><ul>${qs.map(q=>`<li>${esc(q)}</li>`).join("")}</ul></div>
  <h1>${esc(R[ti][0])}</h1>
  ${countMode?`<p class="note"><b>Count mode.</b> Type what you physically count and press Enter or move to the next box. It saves straight away. Hoses in metres, oil in litres. Leave a box empty if you did not count it.</p>`:
  `<div class="meta">${u.map(r=>`<b>${esc(r[0])}</b><span>${esc(r[1])}</span>`).join("")}${u.map((r,k)=>`<b>${esc(r[3])}</b><span class="v">${k<2?"R "+money(vals[k]):qty(vals[k])}</span>`).join("")}</div>
  <p class="note">${esc(R[ti+4][0])} Blue = counted live on this link.</p>`}
  <div class="bar"><input id="q" type="search" placeholder="Search code, description, customer or W/O" aria-label="Search this sheet">
  ${countMode?`<label><input type="checkbox" id="nc"> Not counted yet only</label>`:""}<span class="stamp" id="cnt"></span></div>
  <div class="tbl"><table><thead><tr>${cols.map(j=>`<th>${esc(H[j])}</th>`).join("")}</tr></thead><tbody id="tb"></tbody></table></div>`;
  const N=[4,5,6], M=[12,13,14,15], L=LIVE[WH(s.name)];
  const draw=()=>{const q=document.getElementById("q").value.trim().toLowerCase(), nc=document.getElementById("nc")?.checked;let n=0;
    const body=X.out.filter(o=>(!q||o.r.join(" ").toLowerCase().includes(q))&&(!nc||!L[o.r[1]]));
    n=body.length;
    let html=body.map(o=>{const r=o.r;
      if(countMode){const lv=L[r[1]];return `<tr class="${lv?"l":""}"><td>${esc(r[0])}</td><td class="code">${esc(r[1])}</td><td class="w">${esc(r[2])}</td><td>${esc(r[3])}</td><td class="n"><input class="cnt" inputmode="decimal" aria-label="Count for ${esc(r[1])}" data-c="${esc(r[1])}" value="${lv?lv.qty:""}"><span class="ok" aria-live="polite"></span></td></tr>`}
      return `<tr class="${o.cls}">${r.map((v,j)=>`<td class="${N.includes(j)||M.includes(j)?"n":j===2||j===7||j===17?"w":j===1?"code":""}">${M.includes(j)?money(v):N.includes(j)?qty(v):esc(v)}</td>`).join("")}</tr>`}).join("");
    if(!countMode&&!q) html+=`<tr class="tot"><td></td><td></td><td></td><td>TOTAL</td>${"<td></td>".repeat(9)}<td class="n">${money(X.tc)}</td><td></td><td class="n">${money(X.ts)}</td><td></td><td></td></tr>`;
    document.getElementById("tb").innerHTML=html;
    document.getElementById("cnt").textContent=`${n} lines`;
    document.querySelectorAll(".cnt").forEach(inp=>{inp.onchange=()=>save(s.name,inp);inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();inp.blur();const all=[...document.querySelectorAll(".cnt")];all[all.indexOf(inp)+1]?.focus()}}});
  };
  document.getElementById("q").oninput=draw; const nc=document.getElementById("nc"); if(nc) nc.onchange=draw; draw();
}
const pending={};
async function save(name,inp){
  const code=inp.dataset.c, wh=WH(name), raw=inp.value.trim().replace(",","."), ok=inp.nextElementSibling;
  const ref=DB.collection(`counts_${wh}_${shard(code)}`).doc(docId(code));
  if(raw!==""&&!isFinite(+raw)){ok.textContent="Numbers only";return}
  const prev=pending[wh+code]||Promise.resolve();
  pending[wh+code]=prev.then(async()=>{
    try{ if(raw==="") await ref.delete(); else await ref.set({code,wh,qty:+raw,by:ME||"",at:Date.now()});
      ok.textContent="Saved ✓"; setTimeout(()=>{ok.textContent=""},2500);
    }catch(e){ ok.textContent=e&&e.code==="invalid_argument"?"Not allowed":"Not saved, try again"; if(e&&e.code==="invalid_argument"){CANWRITE=false;bar()} }
  });
}
function cmpRows(){ // every counted line (sheet counts + live counts) against Sage
  const out=[];
  for(const name of ["Workshop","Van MSU"]){const U=UNITS[name], L=LIVE[WH(name)], seen=new Set();
    for(const r of U.base){const c=r[1]; if(!c||r[3]==="TOTAL"||seen.has(c)) continue; seen.add(c);
      const lv=L[c], baked=name==="Workshop"?EXP.baked[c]:(EXP.vbaked||{})[c]; if(!lv&&baked===undefined) continue;
      const e=name==="Workshop"?EXP.ws[c]:EXP.van[c]; if(!e) continue;
      const sage=e[0], van=name==="Workshop"?e[1]:null, exp=name==="Workshop"?e[2]:e[1], cnt=lv?lv.qty:baked, d=Math.round((cnt-exp)*100)/100, cost=typeof r[12]==="number"?r[12]:0;
      out.push({u:name==="Workshop"?"Workshop":"Van",c,desc:r[2],sage,van,exp,cnt,d,cost,val:d*cost,live:!!lv,neg:sage<0});}}
  return out.sort((a,b)=>a.val-b.val);
}
function compare(el){
  const all=cmpRows(), sum=f=>all.filter(f).reduce((a,x)=>a+x.val,0);
  const short=all.filter(x=>x.d<0), over=all.filter(x=>x.d>0), match=all.filter(x=>x.d===0);
  const tile=(lab,v,sub)=>`<div class="tile"><b>${esc(lab)}</b><span class="v">${v}</span><small>${esc(sub)}</small></div>`;
  el.innerHTML=`<h1>Count vs Sage</h1>
  <p class="note">Every counted line against what Sage says should be there. Workshop expected = Sage qty less the van; Van expected = MSU list less W/O job cards. Difference = Count − Expected, valued at Sage avg cost. Updates live as counts come in on this link.</p>
  <div class="tiles">${tile("Lines counted",qty(all.length),`${match.length} match · ${over.length} over · ${short.length} short`)}
  ${tile("Short","R "+money(sum(x=>x.val<0&&!x.neg)),"lines Sage has positive")}
  ${tile("Over","R "+money(sum(x=>x.val>0&&!x.neg)),"lines Sage has positive")}
  ${tile("Negative in Sage","R "+money(sum(x=>x.neg)),"sold but never booked in")}
  ${tile("Net difference","R "+money(sum(()=>true)),"all counted lines")}</div>
  <div class="bar"><input id="q" type="search" placeholder="Search code or description" aria-label="Search">
  <label>Show <select id="f"><option value="">All</option><option value="s">Short</option><option value="o">Over</option><option value="n">Negative in Sage</option><option value="m">Match</option></select></label><span class="stamp" id="cnt"></span></div>
  <div class="tbl"><table><thead><tr><th>Unit</th><th>Code</th><th>Description</th><th>Sage qty</th><th>On van</th><th>Expected</th><th>Counted</th><th>Difference</th><th>Avg Cost (R)</th><th>Difference value (R)</th></tr></thead><tbody id="tb"></tbody></table></div>
  <p class="stamp">Sheet built ${esc(STAMP)}. Red = short, green = over, amber = Sage qty negative, blue code = counted live.</p>`;
  const draw=()=>{const q=document.getElementById("q").value.trim().toLowerCase(), f=document.getElementById("f").value;
    const rows=all.filter(x=>(!q||(x.c+" "+x.desc).toLowerCase().includes(q))&&(!f||(f==="s"&&x.d<0&&!x.neg)||(f==="o"&&x.d>0&&!x.neg)||(f==="n"&&x.neg)||(f==="m"&&x.d===0)));
    document.getElementById("tb").innerHTML=rows.map(x=>`<tr class="${x.neg?"cn":x.d<0?"cs":x.d>0?"co":""}"><td>${x.u}</td><td class="code${x.live?" lv":""}">${esc(x.c)}</td><td class="w">${esc(x.desc)}</td><td class="n">${qty(x.sage)}</td><td class="n">${x.van==null?"":qty(x.van)}</td><td class="n">${qty(x.exp)}</td><td class="n">${qty(x.cnt)}</td><td class="n">${x.d>0?"+":""}${qty(x.d)}</td><td class="n">${x.cost?money(x.cost):"no cost"}</td><td class="n">${money(x.val)}</td></tr>`).join("")
      +(rows.length?`<tr class="tot"><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td>TOTAL</td><td class="n">${money(rows.reduce((a,x)=>a+x.val,0))}</td></tr>`:`<tr><td colspan="10">Nothing counted yet.</td></tr>`);
    document.getElementById("cnt").textContent=`${rows.length} lines`;};
  document.getElementById("q").oninput=draw; document.getElementById("f").onchange=draw; draw();
}
function show(){bar();const el=document.getElementById("sheet"), s=D[cur];
  if(s.name==="Summary") return summary(el);
  if(s.name==="Count vs Sage") return compare(el);
  if(s.name==="New Fittings"){const R=s.rows,h=s.hdr-1,H=R[h],body=R.slice(h+1).filter(r=>r[0]);
    el.innerHTML=`<h1>${esc(R[0][0])}</h1><p class="note">${esc(R[1][0])}</p><div class="tbl"><table><thead><tr>${H.slice(0,8).map(x=>`<th>${esc(x)}</th>`).join("")}</tr></thead><tbody>${
      body.map(r=>`<tr><td class="code">${esc(r[0])}</td><td class="w">${esc(r[1])}</td><td>${esc(r[2])}</td><td class="n">${money(r[3])}</td><td class="n">${money(r[4])}</td><td>${esc(r[5])}</td><td>${esc(r[6])}</td><td class="n">${qty(r[7])}</td></tr>`).join("")}</tbody></table></div>`;return}
  unitSheet(el);
}
let redrawT=null;
function liveChanged(){ // keep typing undisturbed in count mode
  if(countMode&&document.activeElement&&document.activeElement.classList.contains("cnt")){bar();return}
  clearTimeout(redrawT); redrawT=setTimeout(show,150);
}
async function resolveNames(){
  const ids=[...new Set([...Object.values(LIVE.van),...Object.values(LIVE.ws)].map(x=>x.by).filter(Boolean))];
  if(!ids.length||!window.__user) return;
  try{const ps=await window.__user.profiles(ids); let changed=false; for(const id of ids){const nm=ps[id]?.name||""; if(nm&&NAMES[id]!==nm){NAMES[id]=nm;changed=true}} if(changed) liveChanged()}catch(e){}
}
function hashRoute(){const h=location.hash.slice(1);
  const m={"van-count":["Van MSU",true],"workshop-count":["Workshop",true],"van":["Van MSU",false],"workshop":["Workshop",false],"summary":["Summary",false],"count-vs-sage":["Count vs Sage",false]}[h];
  if(m){cur=D.findIndex(s=>s.name===m[0]);countMode=m[1]&&CANWRITE}}
try{const v=+localStorage.getItem("ffsheet");if(v>=0&&v<D.length)cur=v}catch(e){}
hashRoute(); tabs(); show();
window.addEventListener("hashchange",()=>{hashRoute();tabs();show()});
(async()=>{
  const C=window.claude; if(!C||!C.use){bar();return}
  const [db,user]=await Promise.all([C.use("db"),C.use("user")]);
  window.__user=user; DB=db;
  if(user){try{ME=await user.id()}catch(e){} try{const c=await user.can("data.write");CANWRITE=c!==false}catch(e){CANWRITE=true}}
  if(!DB){CANWRITE=false;show();return}
  if(!ME) CANWRITE=false;
  hashRoute(); tabs(); show();
  for(const wh of ["van","ws"]) for(const k of [0,1]){
    const seen={};
    DB.collection(`counts_${wh}_${k}`).onSnapshot(snap=>{
      for(const ch of snap.docChanges()){const d=ch.doc.data(); if(!d||!d.code) continue;
        if(ch.type==="removed") delete LIVE[wh][d.code]; else LIVE[wh][d.code]={qty:+d.qty,by:d.by,at:d.at};}
      liveChanged(); resolveNames();
    },e=>{document.getElementById("livemsg")&&(document.getElementById("livemsg").textContent="Live counts stopped. Reload the page.")});
  }
})();
</script>
