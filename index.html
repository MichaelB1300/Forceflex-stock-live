      const lv=L[c], baked=name===WHS?EXP.baked[c]:(EXP.vbaked||{})[c]; if(!lv&&baked===undefined) continue;
      const e=name===WHS?EXP.ws[c]:EXP.van[c]; if(!e) continue;
      const sage=e[0], van=name===WHS?e[1]:null, exp=name===WHS?e[2]:e[1], cnt=lv?lv.qty:baked, d=Math.round((cnt-exp)*100)/100, cost=typeof r[12]==="number"?r[12]:0;
      out.push({u:name===WHS?"Workshop":"Van",c,desc:r[2],sage,van,exp,cnt,d,cost,val:d*cost,live:!!lv,neg:sage<0});}}
  return out.sort((a,b)=>a.val-b.val);
}
function compare(el){
  const all=cmpRows(), sum=f=>all.filter(f).reduce((a,x)=>a+x.val,0);
  const short=all.filter(x=>x.d<0), over=all.filter(x=>x.d>0), match=all.filter(x=>x.d===0);
  const tile=(lab,v,sub)=>`<div class="tile"><b>${esc(lab)}</b><span class="v">${v}</span><small>${esc(sub)}</small></div>`;
  el.innerHTML=`<h1>Count vs Sage</h1>
  <p class="note">Every counted line against what Sage says should be there. Workshop expected = Sage qty less the van; Van expected = MSU list less W/O job cards. Difference = Count − Expected, valued at Sage avg cost. Updates live as counts come in on this link.</p>
  <div class="tiles">${tile("Lines counted",qty(all.length),`${match.length} match · ${over.length} over · ${short.length} short`)}
  ${tile("Short","R "+money(sum(x=>x.val<0&&!x.neg)),"lines Sage has positive")}
  ${tile("Over","R "+money(sum(x=>x.val>0&&!x.neg)),"lines Sage has positive")}
  ${tile("Negative in Sage","R "+money(sum(x=>x.neg)),"sold but never booked in")}
  ${tile("Net difference","R "+money(sum(()=>true)),"all counted lines")}</div>
  <div class="bar"><input id="q" type="search" placeholder="Search code or description" aria-label="Search">
  <label>Show <select id="f"><option value="">All</option><option value="s">Short</option><option value="o">Over</option><option value="n">Negative in Sage</option><option value="m">Match</option></select></label><span class="stamp" id="cnt"></span></div>
  <div class="tbl"><table><thead><tr><th>Unit</th><th>Code</th><th>Description</th><th>Sage qty</th><th>On van</th><th>Expected</th><th>Counted</th><th>Difference</th><th>Avg Cost (R)</th><th>Difference value (R)</th></tr></thead><tbody id="tb"></tbody></table></div>
  <p class="stamp">Sheet built ${esc(STAMP)}. Red = short, green = over, amber = Sage qty negative, blue code = counted live.</p>`;
  const draw=()=>{const q=document.getElementById("q").value.trim().toLowerCase(), f=document.getElementById("f").value;
    const rows=all.filter(x=>(!q||(x.c+" "+x.desc).toLowerCase().includes(q))&&(!f||(f==="s"&&x.d<0&&!x.neg)||(f==="o"&&x.d>0&&!x.neg)||(f==="n"&&x.neg)||(f==="m"&&x.d===0)));
    document.getElementById("tb").innerHTML=rows.map(x=>`<tr class="${x.neg?"cn":x.d<0?"cs":x.d>0?"co":""}"><td>${x.u}</td><td class="code${x.live?" lv":""}">${esc(x.c)}</td><td class="w">${esc(x.desc)}</td><td class="n">${qty(x.sage)}</td><td class="n">${x.van==null?"":qty(x.van)}</td><td class="n">${qty(x.exp)}</td><td class="n">${qty(x.cnt)}</td><td class="n">${x.d>0?"+":""}${qty(x.d)}</td><td class="n">${x.cost?money(x.cost):"no cost"}</td><td class="n">${money(x.val)}</td></tr>`).join("")
      +(rows.length?`<tr class="tot"><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td>TOTAL</td><td class="n">${money(rows.reduce((a,x)=>a+x.val,0))}</td></tr>`:`<tr><td colspan="10">Nothing counted yet.</td></tr>`);
    document.getElementById("cnt").textContent=`${rows.length} lines`;};
  document.getElementById("q").oninput=draw; document.getElementById("f").onchange=draw; draw();
}
function show(){bar();const el=document.getElementById("sheet"), s=D[cur];
  if(s.name==="Summary") return summary(el);
  if(s.name==="Count vs Sage") return compare(el);
  if(s.name==="New Fittings"){const R=s.rows,h=s.hdr-1,H=R[h],body=R.slice(h+1).filter(r=>r[0]);
    el.innerHTML=`<h1>${esc(R[0][0])}</h1><p class="note">${esc(R[1][0])}</p><div class="tbl"><table><thead><tr>${H.slice(0,8).map(x=>`<th>${esc(x)}</th>`).join("")}</tr></thead><tbody>${
      body.map(r=>`<tr><td class="code">${esc(r[0])}</td><td class="w">${esc(r[1])}</td><td>${esc(r[2])}</td><td class="n">${money(r[3])}</td><td class="n">${money(r[4])}</td><td>${esc(r[5])}</td><td>${esc(r[6])}</td><td class="n">${qty(r[7])}</td></tr>`).join("")}</tbody></table></div>`;return}
  unitSheet(el);
}
let redrawT=null;
function liveChanged(){ // keep typing undisturbed in count mode
  if(countMode&&document.activeElement&&document.activeElement.classList.contains("cnt")){bar();return}
  clearTimeout(redrawT); redrawT=setTimeout(show,150);
}
async function resolveNames(){
  const ids=[...new Set([...Object.values(LIVE.van),...Object.values(LIVE.ws)].map(x=>x.by).filter(Boolean))];
  if(!ids.length||!window.__user) return;
  try{const ps=await window.__user.profiles(ids); let changed=false; for(const id of ids){const nm=ps[id]?.name||""; if(nm&&NAMES[id]!==nm){NAMES[id]=nm;changed=true}} if(changed) liveChanged()}catch(e){}
}
function hashRoute(){const h=location.hash.slice(1);
  const m={"van-count":[MSU,true],"workshop-count":[WHS,true],"van":[MSU,false],"msu":[MSU,false],"workshop":[WHS,false],"wh":[WHS,false],"combined":[CMB,false],"summary":["Summary",false],"count-vs-sage":["Count vs Sage",false]}[h];
  if(m){const k=D.findIndex(s=>s.name===m[0]); if(k>=0){cur=k;countMode=m[1]&&CANWRITE}}}
try{const v=+localStorage.getItem("ffsheet");if(v>=0&&v<D.length)cur=v}catch(e){}
hashRoute(); tabs(); show();
window.addEventListener("hashchange",()=>{hashRoute();tabs();show()});
(async()=>{
  const C=window.claude; if(!C||!C.use){bar();return}
  const [db,user]=await Promise.all([C.use("db"),C.use("user")]);
  window.__user=user; DB=db;
  if(user){try{ME=await user.id()}catch(e){} try{const c=await user.can("data.write");CANWRITE=c!==false}catch(e){CANWRITE=true}}
  if(!DB){CANWRITE=false;show();return}
  if(!ME) CANWRITE=false;
  hashRoute(); tabs(); show();
  for(const wh of ["van","ws"]) for(const k of [0,1]){
    const seen={};
    DB.collection(`counts_${wh}_${k}`).onSnapshot(snap=>{
      for(const ch of snap.docChanges()){const d=ch.doc.data(); if(!d||!d.code) continue;
        if(ch.type==="removed") delete LIVE[wh][d.code]; else LIVE[wh][d.code]={qty:+d.qty,by:d.by,at:d.at};}
      liveChanged(); resolveNames();
    },e=>{document.getElementById("livemsg")&&(document.getElementById("livemsg").textContent="Live counts stopped. Reload the page.")});
  }
})();
</script>
